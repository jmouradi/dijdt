<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root {
  /* this has to be set to switch between light or dark */
  color-scheme: light dark;

  --light-bg: ghostwhite;
  --light-color: darkslategray;
  --light-error: darkred;

  --dark-bg: black;
  --dark-color: ghostwhite;
  --dark-error: salmon;
}
* {
  background-color: light-dark(var(--light-bg), var(--dark-bg));
  color: light-dark(var(--light-color), var(--dark-color));
}
html {
    font-size: 112.5%;
}
input {
    padding: 0.2em;
    box-sizing: border-box;
    width: 100%
}
.light {
    /* forces light color-scheme */
    color-scheme: light;
}
.dark {
    /* forces dark color-scheme */
    color-scheme: dark;
}
.buttonContainer {
    display: grid; /* Places child divs side-by-side in a row */
    grid-template-columns: 1fr 2fr;
    column-gap: 10px;
    row-gap: 15px;
}
.addRemoveContainer {
    display: grid; /* Places child divs side-by-side in a row */
    grid-template-columns: 2fr 1fr 1fr;
    column-gap: 10px
}
.paddedButton {
    width:100%;
    display:block;
    border-radius: 10px;
    border: 2px;
    border: 2px solid light-dark(var(--light-color), var(--dark-color));
    font-size: 112.5%;
}
.button {
    border-radius:10px;
    border: 2px solid light-dark(var(--light-color), var(--dark-color));
    font-size: 112.5%;
}
.error {
    color: light-dark(var(--light-error), var(--dark-error));
}
/* Increase font even more on mobile */

</style>
<script>

document.addEventListener("DOMContentLoaded", () => {
    timeMap = getTimeMap();
    renderElements(timeMap);
});

function printError(error) {
    const e = document.getElementById("error");
    const errorString = "Error: " + error;
    e.innerHTML=`
<p class="error">${errorString}</p>
<button onClick="clearError()" class="button">Clear Error</button>
`
}

function clearError() {
    const e = document.getElementById("error");
    e.innerHTML = "";
}

function getTimeMap() {
    if (typeof(Storage) == "undefined") {
       return printError("local storage required but unsupported.");
    }
    let timeMap;
    if (localStorage.timeMap) {
        console.log("loading existing map from storage");
        timeMap = new Map(JSON.parse(localStorage.timeMap));
    } else {
        console.log("creating new map");
        timeMap = new Map();
        timeMap.set("Example", null);
    }
    return timeMap;
}

function renderElements(timeMap) {
    const x = document.getElementById("result");
    x.innerHTML = "";
    function renderMapElements(value, key, map) {
        const renderValue = value ? value : "Not Yet Pressed";
        rows.push(`
    <div><button class="paddedButton" onClick="updateItem('${key}')">${key}</button></div>  <div>${renderValue}</div>
`);
    }
    rows = [];
    rows.push(`<div class="buttonContainer">`);
    timeMap.forEach(renderMapElements);
    rows.push(`</div>`);
    x.innerHTML = rows.join("\n");
}

function addItem() {
    if (typeof(Storage) == "undefined") {
        return printError("local storage undefined");
    }
    timeMap = getTimeMap();
    if (!timeMap) {
        return printError("failed to retrieve timeMap.");
    }
    const newKey = document.getElementById("buttonName").value;
    if (!newKey) {
        return printError("no item name to add");
    }
    if (timeMap.has(newKey)) {
        return printError(`key '${newKey}' already present`);
    }
    timeMap.set(newKey, null);
    localStorage.timeMap = JSON.stringify(Array.from(timeMap.entries()));
    renderElements(timeMap);
}

function removeItem() {
    timeMap = getTimeMap();
    if (!timeMap) {
        return printError("failed to retrieve timeMap");
    }
    const remKey = document.getElementById("buttonName").value;
    if (!remKey) {
        return printError("no item name to remove");
    }
    if (!timeMap.has(remKey)) {
        return printError(`key '${remKey}' not present`);
    }
    timeMap.delete(remKey);
    localStorage.timeMap = JSON.stringify(Array.from(timeMap.entries()));
    renderElements(timeMap);
}

function updateItem(updateKey) {
    timeMap = getTimeMap();
    if (!timeMap) {
        return printError("failed to retrieve timeMap");
    }
    if (!timeMap.has(updateKey)) {
        return printError("key not present");
    }
    timeMap.set(updateKey, new Date().toLocaleString());
    localStorage.timeMap = JSON.stringify(Array.from(timeMap.entries()));
    renderElements(timeMap);
}
</script>
</head>
<body>
<h1> Did I just do that?</h1>
<p>Press a button to see when you last did something.</p>
<output id="result"></output>
<p>Add or remove items to track below.</p>
<div class="addRemoveContainer">
    <div><input id="buttonName" type="text/html"> </div>
    <div><button onClick="addItem()" class="button">Add</button></div>
    <div><button onClick="removeItem()" class="button">Remove</button></div>
</div>
<output id="error"></output>
</body>
</html>
